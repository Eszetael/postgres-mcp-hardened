# Dependency updates arrive as pull requests, which means they arrive through the same checks as
# everything else: the PostgreSQL matrix, the adversarial corpus, the TLS suite. An update that
# breaks a refusal cannot merge.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      # One pull request for the routine bumps, so the interesting ones are not buried in noise.
      patch-and-minor:
        update-types: [minor, patch]

  # The workflows hold `contents: write` and `id-token: write`. An action left on a tag that moves
  # is an unreviewed dependency with permission to publish under our name, so these get watched too.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      # One pull request for all of them. Ungrouped, the first week produced five separate PRs and
      # five CI runs for what is one review decision — and a queue of runs is how a release
      # rehearsal ends up waiting behind housekeeping.
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
