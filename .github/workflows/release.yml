name: Release

# Zero-friction distribution: on a v* tag, build binaries for 5 platforms and attach them to the GitHub Release.
# A user downloads one file and points claude_desktop_config.json at it - no npx, no cargo.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # a pinned version, not a moving "stable" - otherwise "reproducibly built" is just a slogan
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          targets: ${{ matrix.target }}

      # aarch64-linux does not build natively on an x86 runner - use cross (Docker).
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # a pinned TAG, not git HEAD: the build tool holds contents:write permission,
        # so a malicious upstream commit would land straight in our release
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          BIN=postgres-mcp-hardened
          DIR="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${BIN}-${{ matrix.target }}.zip" "./${DIR}/${BIN}.exe"
          else
            tar -czf "${BIN}-${{ matrix.target }}.tar.gz" -C "${DIR}" "${BIN}"
          fi

      # Checksums — the compliance document promises them, so they must actually be produced.
      - name: Checksums
        shell: bash
        run: |
          BIN=postgres-mcp-hardened
          for f in ${BIN}-${{ matrix.target }}.*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256";
            else shasum -a 256 "$f" > "$f.sha256"; fi
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: postgres-mcp-hardened-${{ matrix.target }}.*
