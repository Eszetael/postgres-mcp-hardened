name: Release

# Third-party actions are pinned to a commit, not a tag. These jobs hold `contents: write` and
# `id-token: write`: a tag that moves is an unreviewed dependency with permission to publish under
# our name. Dependabot proposes the bumps, and they arrive as reviewable pull requests.

# Zero-friction distribution: on a v* tag, build binaries for 5 platforms and attach them to the GitHub Release.
# A user downloads one file and points claude_desktop_config.json at it - no npx, no cargo.
on:
  push:
    tags:
      - 'v*'

# Domyślnie READ dla całego przepływu; zapis przyznaje się ZADANIU, które go potrzebuje.
# Poprzednio `contents: write` stało na poziomie przepływu, więc dziedziczyły je także `checks`,
# `build` i `sbom` — zadania, które niczego nie publikują. Token z prawem zapisu w zadaniu, które
# tylko kompiluje, to nadmiar, który nic nie kosztuje, dopóki nie kosztuje wszystkiego.
permissions:
  contents: read

jobs:
  # Nothing is published that these gates have not approved. Before this, pushing a tag built
  # and released binaries and a container image without a single test having run.
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: [checks]
    name: Build ${{ matrix.target }}
    # This job uploads the archives, so it needs write. It was taken away on 28.07 by a
    # least-privilege pass whose justification said "grep finds no release upload, no
    # `gh release`" — true of the string, false of the job, which uploads through
    # `softprops/action-gh-release`. Every tag since then would have produced a release with
    # no binaries in it, and nobody saw it because no tag was pushed until the rc7 rehearsal.
    # `scripts/check_release_permissions.py` now derives this from the workflow itself.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain comes from rust-toolchain.toml — one file, read by rustup, so the version
      # cannot differ between a laptop, the test matrix and the artefacts people download. The
      # cross-compilation target is added on top of it.
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      # aarch64-linux does not build natively on an x86 runner - use cross (Docker).
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # a pinned TAG, not git HEAD: the build tool holds contents:write permission,
        # so a malicious upstream commit would land straight in our release
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          BIN=postgres-mcp-hardened
          DIR="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${BIN}-${{ matrix.target }}.zip" "./${DIR}/${BIN}.exe"
          else
            tar -czf "${BIN}-${{ matrix.target }}.tar.gz" -C "${DIR}" "${BIN}"
          fi

      # Checksums — the compliance document promises them, so they must actually be produced.
      - name: Checksums
        shell: bash
        run: |
          BIN=postgres-mcp-hardened
          for f in ${BIN}-${{ matrix.target }}.*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256";
            else shasum -a 256 "$f" > "$f.sha256"; fi
          done

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # A `-rc` tag is a rehearsal of this workflow, not a release: it stays a draft so the
          # artefacts can be inspected before anything is visible to anyone.
          draft: ${{ contains(github.ref, '-rc') }}
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: postgres-mcp-hardened-${{ matrix.target }}.*

      # Also as a workflow artefact, because the signing job runs on a different machine and cannot
      # sign files it has never seen. Without this the signing job would download nothing and
      # succeed at signing zero files — a green build producing an unsigned release.
      - name: Hand the artefacts to the signing job
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: postgres-mcp-hardened-${{ matrix.target }}.*
          if-no-files-found: error

  # The most common complaint against the leading alternative is that its published image lags the
  # code by months. Publishing from the same tag that builds the binaries makes that impossible.
  # A software bill of materials belongs with the artifact, not in a promise: reviewers in regulated
  # environments ask for it first.
  sign:
    # Keyless Sigstore: no key to store, no key to leak, and the identity in the certificate is this
    # workflow in this repository. `id-token: write` is requested HERE and nowhere else, because it
    # is the permission that lets a job speak for the repository.
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign every artefact and its checksum file
        run: |
          shopt -s nullglob
          n=0
          for f in dist/*; do
            [ -f "$f" ] || continue
            # Two forms on purpose. The bundle is what Sigstore wants now — signature, certificate
            # and transparency-log entry in one file, verified with `cosign verify-blob --bundle`.
            # The separate .sig/.pem are the older shape, which every cosign in the wild still
            # accepts and which the flags in our README use; cosign already prints a deprecation
            # warning for them, so they exist for people who have not upgraded yet, not forever.
            cosign sign-blob --yes --bundle "$f.bundle" \
                             --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
            n=$((n+1))
          done
          # Signing nothing must not pass for signing everything.
          [ "$n" -gt 0 ] || { echo "no artefacts to sign"; exit 1; }
          echo "signed $n artefacts"
      # Provenance is persisted by GitHub, and GitHub accepts it only for public repositories. A
      # private rehearsal therefore cannot produce it. That is a platform limit, not a choice — but
      # it must be said out loud in the log, because a signing job that quietly stops attesting is
      # exactly the failure nobody notices until someone checks a release that has no provenance.
      - name: Build provenance (public repositories only)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'
      - name: Say plainly when provenance was not produced
        if: ${{ github.event.repository.private }}
        run: |
          echo "::warning title=No provenance::This repository is private, so GitHub will not persist           a build attestation. The artefacts ARE signed (cosign keyless, see the .sig/.pem files);           only the SLSA provenance is missing, and it will be produced once the repository is public."
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: ${{ contains(github.ref, '-rc') }}
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: |
            dist/*.sig
            dist/*.pem
            dist/*.bundle

  # npm is where the users are. The package this replaces is fetched half a million times a month
  # through `npx`, and none of those people have a Rust toolchain — a GitHub Release alone reaches
  # almost none of them. The wrapper published here downloads the binary built above.
  #
  # It runs AFTER `build`, and not in parallel, because the checksums it bakes in are computed from
  # the artefacts that job produced. A wrapper published with checksums from a different build would
  # refuse to install — correctly, and confusingly.
  npm:
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance: the registry records which workflow published this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Take the version from the tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd npm
          node -e '
            const fs=require("fs"), p=JSON.parse(fs.readFileSync("package.json"));
            p.version=process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");
          ' "$V"
          echo "publishing npm version $V"

      # The checksum list is the package's whole trust story: it travels inside the tarball, under
      # npm's own integrity hash, so a swapped GitHub asset cannot pass. Built here from the real
      # artefacts — never hand-written.
      - name: Record the checksums of the artefacts just built
        shell: bash
        run: |
          cd npm
          : > /tmp/sums.txt
          for f in ../dist/postgres-mcp-hardened-*.tar.gz ../dist/postgres-mcp-hardened-*.zip; do
            [ -f "$f" ] || continue
            printf '%s %s\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" >> /tmp/sums.txt
          done
          node -e '
            const fs=require("fs");
            const out={};
            for (const line of fs.readFileSync("/tmp/sums.txt","utf8").split("\n")) {
              const [name,sum]=line.trim().split(/\s+/);
              if (name && sum) out[name]=sum;
            }
            // Five targets are built; anything less means an artefact went missing and users on
            // that platform would hit "no checksum recorded" instead of an install.
            const n=Object.keys(out).length;
            if (n !== 5) { console.error(`expected 5 archives, found ${n}`); process.exit(1); }
            fs.writeFileSync("checksums.json", JSON.stringify(out,null,2)+"\n");
            console.log(fs.readFileSync("checksums.json","utf8"));
          '

      - name: Test the wrapper against the artefacts it will ship with
        run: cd npm && npm test

      - name: Publish
        # A `-rc` tag rehearses the release; it must not land on the registry, where publishing is
        # irreversible (unpublish is a 72-hour window and a broken promise to anyone who installed).
        if: ${{ !contains(github.ref, '-rc') }}
        run: cd npm && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Rehearsal — show what would be published
        if: ${{ contains(github.ref, '-rc') }}
        run: cd npm && npm publish --dry-run --access public

  sbom:
    needs: [checks]
    # Attaches the bill of materials to the release — same 403, same cause as `build`.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - name: Attach the SBOM to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: ${{ contains(github.ref, '-rc') }}
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: "**/*.cdx.json"

  container:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # arm64 is compiled under emulation here, which takes the best part of an hour for a Rust
          # build. Cached layers make a re-run of the same release minutes instead — and a release
          # that has to be re-run is exactly the moment nobody wants to wait an hour.
          cache-from: type=gha
          cache-to: type=gha,mode=max
