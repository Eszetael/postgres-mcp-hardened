name: CI

# Tests, lint and fuzz on EVERY change. Without this, the unit tests and the fuzz harness are
# decoration: nobody runs them and a regression lands quietly. For a security server that is
# unacceptable. The gates themselves live in checks.yml so that a release runs the same ones.
on:
  push:
    branches: [main]
  pull_request:

# Najmniejsze potrzebne uprawnienia, jawnie. Bez tego klucza `GITHUB_TOKEN` dostaje
# domyślny zestaw repozytorium — a ten przepływ chodzi przy KAŻDYM pull requeście,
# czyli na kodzie, którego nie pisaliśmy. `release.yml` i `spec-drift.yml` miały to od
# początku; te dwa nie, i nikt tego nie zauważył do rundy G4.
permissions:
  contents: read

# One run per branch. Today sixty-five commits went out and every superseded push kept running to
# completion on six PostgreSQL versions — minutes spent proving things about commits that had already
# been replaced. Cancelling them is the single largest saving available and costs nothing: the only
# result discarded is one nobody was going to read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
