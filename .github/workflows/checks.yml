name: Checks

# Every gate this project has, in one reusable workflow.
#
# It exists as `workflow_call` for one reason: a release must not be able to publish anything these
# jobs have not approved. Before this, `release.yml` ran `build`, `sbom` and `container` with no
# `needs:` at all — pushing a tag published binaries and a container image without a single test
# having run. Duplicating the jobs into the release workflow would have meant two copies drifting
# apart, which is the same failure a year later.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The validator's deny-list is version-dependent — `pg_backup_start` (15+) replaced
    # `pg_start_backup` (<=14), `pg_read_all_data` arrived in 14, `pg_maintain` in 17 — so testing a
    # single version tells us about a single version.
    strategy:
      fail-fast: false
      matrix:
        pg: ["13", "14", "15", "16", "17"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret - throwaway CI database, dies with the runner
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.pg == '16'
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        if: matrix.pg == '16'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit and adversarial tests
        run: cargo test --locked --release

      - name: Validator fuzz (3 seeds x 200k mutants)
        if: matrix.pg == '16'
        run: |
          cargo build --locked --release
          for seed in 1 42 20260726; do
            ./target/release/postgres-mcp-hardened --fuzz 200000 "$seed"
          done

      - name: Smoke test against a live database (reads work, writes rejected)
        env:
          DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres  # pragma: allowlist secret
        run: |
          cargo build --locked --release
          ./target/release/postgres-mcp-hardened --validate "SELECT 1" | grep -q ALLOW
          ./target/release/postgres-mcp-hardened --validate "DROP TABLE x" | grep -q REJECT
          MCP_ADDR=127.0.0.1:8080 ./target/release/postgres-mcp-hardened &
          sleep 3
          curl -sf -H content-type:application/json http://127.0.0.1:8080/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"query","arguments":{"sql":"SELECT 1 AS ok"}}}' | grep -q 'returnedRows'
          curl -s -H content-type:application/json http://127.0.0.1:8080/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"query","arguments":{"sql":"CREATE TABLE t(x int)"}}}' | grep -q 'non-read-only'

  acceptance:
    # The end-to-end suite: every scenario reported against the deprecated server, plus the
    # deployment shapes people actually run. It starts its own PostgreSQL through docker.
    strategy:
      fail-fast: false
      matrix:
        pg: ["13", "17"]  # the extremes; 16 is covered by the unit matrix above
    runs-on: ubuntu-latest
    env:
      PG_IMAGE: postgres:${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: ./tests/acceptance.sh

  adversarial:
    # The corpus is the public form of every claim this project makes about refusals. It runs here on
    # a throwaway schema, and anyone can run the same file against their own database — which is the
    # only version of a security claim that can be checked without trusting us.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret - throwaway CI database, dies with the runner
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Seed a schema for the corpus to run against
        env:
          PGPASSWORD: ci  # pragma: allowlist secret
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE staff (staff_id int, first_name text, password text);
          INSERT INTO staff VALUES (1, 'Ada', 'a-secret-hash');
          CREATE TABLE film (title text);
          INSERT INTO film VALUES ('Casablanca');
          CREATE SEQUENCE seq;
          SQL
      - name: Run the adversarial corpus
        env:
          ADV_URL: postgres://postgres:ci@127.0.0.1:5432/postgres  # pragma: allowlist secret
        run: ./tests/adversarial/run.sh

  tls:
    # The only cryptographic claim this project makes, and until this job existed it had no executor:
    # CI ran PostgreSQL without TLS and the acceptance suite never touched it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: ./tests/tls.sh

  docs-claims:
    # Documentation honesty as a build gate. Claims drift from code silently — a "verified" that
    # names no test, a settings table that has fallen behind — and by the time a user notices, the
    # damage is to trust, not to a feature.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/docs_claims.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - name: cargo-audit (dependency vulnerabilities)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: cargo-deny (licences, duplicate and unknown sources)
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds, runs as nonroot, and actually serves
        run: |
          docker build -t mcp-pg:ci .
          test "$(docker inspect mcp-pg:ci -f '{{.Config.User}}')" = "nonroot"
          # Building an image proves it compiles, not that it works. Start a database, point the
          # image at it, and require a real answer over HTTP before calling the image good.
          docker network create mcpci
          docker run -d --name pgci --network mcpci \
            -e POSTGRES_PASSWORD=ci \
            postgres:16  # pragma: allowlist secret
          for _ in $(seq 1 40); do docker exec pgci pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec -i pgci psql -U postgres -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE reader LOGIN PASSWORD 'reader_pw';
          GRANT CONNECT ON DATABASE postgres TO reader;
          GRANT USAGE ON SCHEMA public TO reader;
          CREATE TABLE demo(id int);
          INSERT INTO demo VALUES (1);
          GRANT SELECT ON demo TO reader;
          SQL
          # The image listens on 0.0.0.0, so the start-up gate applies to it — which makes this the
          # place to prove the gate works in the artefact people actually run, not only in a test
          # harness. Without a token it must refuse; the first version of this job did not supply one
          # and was refused, correctly, by the server it was testing.
          docker run -d --name mcpnoauth --network mcpci \
            -e DATABASE_URL="postgres://reader:reader_pw@pgci:5432/postgres" mcp-pg:ci
          sleep 5
          code=$(docker inspect mcpnoauth -f '{{.State.ExitCode}}')
          [ "$code" = "3" ] || { echo "expected the gate to refuse an unauthenticated network listener, got exit $code"; docker logs mcpnoauth; exit 1; }
          docker rm -f mcpnoauth

          docker run -d --name mcpci --network mcpci -p 127.0.0.1:8099:8080 \
            -e DATABASE_URL="postgres://reader:reader_pw@pgci:5432/postgres" \
            -e MCP_BEARER_TOKEN=ci-token \
            mcp-pg:ci
          for _ in $(seq 1 30); do curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:8099/health >/dev/null && break; sleep 1; done
          docker logs mcpci 2>&1 | grep -q "read-only as far as the database is concerned" \
            || { echo "the image did not report a read-only role"; docker logs mcpci; exit 1; }
          curl -sf -H content-type:application/json -H 'authorization: Bearer ci-token' http://127.0.0.1:8099/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"query","arguments":{"sql":"SELECT id FROM demo"}}}' \
            | grep -q '"id":1'
          docker rm -f mcpci pgci; docker network rm mcpci

      # An image people are told to trust has to be looked at, not only started. Unfixed findings
      # are reported but do not fail the run: a gate nobody can pass is a gate people switch off,
      # and there is nothing to do about a vulnerability with no patch except know about it.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-pg:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
