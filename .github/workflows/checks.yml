name: Checks

# Every gate this project has, in one reusable workflow.
#
# It exists as `workflow_call` for one reason: a release must not be able to publish anything these
# jobs have not approved. Before this, `release.yml` ran `build`, `sbom` and `container` with no
# `needs:` at all — pushing a tag published binaries and a container image without a single test
# having run. Duplicating the jobs into the release workflow would have meant two copies drifting
# apart, which is the same failure a year later.
on:
  workflow_call:

# Najmniejsze potrzebne uprawnienia, jawnie. Bez tego klucza `GITHUB_TOKEN` dostaje
# domyślny zestaw repozytorium — a ten przepływ chodzi przy KAŻDYM pull requeście,
# czyli na kodzie, którego nie pisaliśmy. `release.yml` i `spec-drift.yml` miały to od
# początku; te dwa nie, i nikt tego nie zauważył do rundy G4.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The validator's deny-list is version-dependent — `pg_backup_start` (15+) replaced
    # `pg_start_backup` (<=14), `pg_read_all_data` arrived in 14, `pg_maintain` in 17 — so testing a
    # single version tells us about a single version.
    strategy:
      fail-fast: false
      matrix:
        # The extremes on every push, the whole range on main and on a release. The version-
        # dependent behaviour we actually have (denylist differences, catalogue additions) shows up
        # between the oldest and newest supported version; the ones in between have never caught
        # anything the extremes did not. Six versions on every commit was a bill, not a control.
        pg: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["13","14","15","16","17","18"]') || fromJSON('["13","18"]') }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # This job runs INSIDE a container, and that is the point.
    #
    # A hosted runner is a disposable virtual machine that belongs to the job. A self-hosted one is
    # an ordinary server with its own services, and every fixed port and every "the host will have
    # this tool" assumption becomes a mine. We hit two on the first real run: the database mapped to
    # 5432 collided with the production Tempus instance, and `MCP_ADDR=127.0.0.1:8080` collided with
    # something already listening there — six jobs died on `AddrInUse`. Moving the port is not a fix,
    # it is the same bug with a different number.
    #
    # In a container the job gets its own network namespace: the service is reachable as `postgres`
    # on its own 5432, nothing is published to the host at all, and the toolchain comes from the
    # image rather than from whatever was last installed on the machine (rustup had already vanished
    # from the host twice).
    container:
      image: rust:1.97.1-bookworm  # matches rust-toolchain.toml, so `rustup show` is a confirmation
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret - throwaway CI database, dies with the runner
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        if: matrix.pg == '16'
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        if: matrix.pg == '16'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit and adversarial tests
        run: cargo test --locked --release

      - name: Validator fuzz (3 seeds x 200k mutants)
        if: matrix.pg == '16'
        run: |
          cargo build --locked --release
          for seed in 1 42 20260726; do
            ./target/release/postgres-mcp-hardened --fuzz 200000 "$seed"
          done

      - name: Smoke test against a live database (reads work, writes rejected)
        env:
          DATABASE_URL: postgres://postgres:ci@postgres:5432/postgres  # pragma: allowlist secret
        run: |
          cargo build --locked --release
          ./target/release/postgres-mcp-hardened --validate "SELECT 1" | grep -q ALLOW
          ./target/release/postgres-mcp-hardened --validate "DROP TABLE x" | grep -q REJECT
          MCP_ADDR=127.0.0.1:8080 ./target/release/postgres-mcp-hardened &
          sleep 3
          curl -sf -H content-type:application/json http://127.0.0.1:8080/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"query","arguments":{"sql":"SELECT 1 AS ok"}}}' | grep -q 'returnedRows'
          curl -s -H content-type:application/json http://127.0.0.1:8080/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"query","arguments":{"sql":"CREATE TABLE t(x int)"}}}' | grep -q 'non-read-only'

      # This job runs as root inside the container, and `target/` outlives it on a disk shared with
      # jobs that do not run in a container. Without this step the next such job died in
      # `actions/checkout` with "EACCES: permission denied, unlink target/CACHEDIR.TAG" — it could
      # not clean up files it does not own. `--reference` takes the owner from the directory the
      # runner itself creates, so no UID is hardcoded here and this is a no-op on a hosted runner.
      - name: Hand the workspace back to the runner's user
        if: always()
        run: chown -R --reference="$RUNNER_WORKSPACE" "$RUNNER_WORKSPACE" || true

  acceptance:
    # The end-to-end suite: every scenario reported against the deprecated server, plus the
    # deployment shapes people actually run. It starts its own PostgreSQL through docker.
    strategy:
      fail-fast: false
      matrix:
        pg: ["13", "18"]  # the extremes; 16 is covered by the unit matrix above
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      PG_IMAGE: postgres:${{ matrix.pg }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --release
      - run: ./tests/acceptance.sh

  adversarial:
    # The corpus is the public form of every claim this project makes about refusals. It runs here on
    # a throwaway schema, and anyone can run the same file against their own database — which is the
    # only version of a security claim that can be checked without trusting us.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # In a container for the same reason as `test` above — and this job is where the second mine went
    # off: the seed step called `psql`, which a hosted runner happens to ship and our own machine does
    # not. A job that assumes tooling is a job that fails on the first machine that lacks it, so the
    # tooling comes from the image and stops being a property of the host.
    container:
      image: rust:1.97.1-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret - throwaway CI database, dies with the runner
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --release
      - name: Install what the seed step and the corpus runner need
        # psql to seed; python3 because tests/free_port.sh asks the operating system for a port that
        # is actually free instead of hoping a constant is.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client python3
      - name: Seed a schema for the corpus to run against
        env:
          PGPASSWORD: ci  # pragma: allowlist secret
        run: |
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE staff (staff_id int, first_name text, password text);
          INSERT INTO staff VALUES (1, 'Ada', 'a-secret-hash');
          CREATE TABLE film (title text);
          INSERT INTO film VALUES ('Casablanca');
          CREATE SEQUENCE seq;
          SQL
      - name: Run the adversarial corpus
        env:
          ADV_URL: postgres://postgres:ci@postgres:5432/postgres  # pragma: allowlist secret
        run: ./tests/adversarial/run.sh

      # This job runs as root inside the container, and `target/` outlives it on a disk shared with
      # jobs that do not run in a container. Without this step the next such job died in
      # `actions/checkout` with "EACCES: permission denied, unlink target/CACHEDIR.TAG" — it could
      # not clean up files it does not own. `--reference` takes the owner from the directory the
      # runner itself creates, so no UID is hardcoded here and this is a no-op on a hosted runner.
      - name: Hand the workspace back to the runner's user
        if: always()
        run: chown -R --reference="$RUNNER_WORKSPACE" "$RUNNER_WORKSPACE" || true

  tls:
    # The only cryptographic claim this project makes, and until this job existed it had no executor:
    # CI ran PostgreSQL without TLS and the acceptance suite never touched it.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --release
      - run: ./tests/tls.sh

  docs-claims:
    # Documentation honesty as a build gate. Claims drift from code silently — a "verified" that
    # names no test, a settings table that has fallen behind — and by the time a user notices, the
    # damage is to trust, not to a feature.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - run: sh tests/docs_claims.sh

  audit:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # rustup honours rust-toolchain.toml, so the version stays in exactly one file.
      - run: rustup show
      - name: cargo-audit (dependency vulnerabilities)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: cargo-deny (licences, duplicate and unknown sources)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      # A permissions change to release.yml cannot be validated by any job in release.yml — that
      # workflow only runs on a tag, which is to say after it is too late. On 28.07 a hardening
      # commit removed the write permission from the jobs that upload the release, and the next ten
      # days of green CI said nothing, because no tag was pushed. This runs on every commit.
      - name: Release permissions match what the jobs actually do
        run: python3 scripts/check_release_permissions.py
      # Same shape, different manifest. `v0.1.2` was published to npm and signed before the registry
      # refused it over one capital letter in the owner's name — a rule that only the tag-triggered
      # job knew about, and therefore learned about after the version number was already spent.
      - name: Registry manifest names the identity that may publish it
        run: python3 scripts/check_registry_identity.py
      # Third of the same shape: a rule that was real, written down, and applied to one publishing
      # channel out of three. `latest` on the container registry pointed at `0.1.2-rc3`.
      - name: No rehearsal moves a pointer users follow
        run: python3 scripts/check_prerelease_guards.py

  container:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Image builds, runs as nonroot, and actually serves
        run: |
          docker build -t mcp-pg:ci .
          test "$(docker inspect mcp-pg:ci -f '{{.Config.User}}')" = "nonroot"
          # Building an image proves it compiles, not that it works. Start a database, point the
          # image at it, and require a real answer over HTTP before calling the image good.
          docker network create mcpci
          docker run -d --name pgci --network mcpci \
            -e POSTGRES_PASSWORD=ci \
            postgres:16  # pragma: allowlist secret
          for _ in $(seq 1 40); do docker exec pgci pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec -i pgci psql -U postgres -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE reader LOGIN PASSWORD 'reader_pw';
          GRANT CONNECT ON DATABASE postgres TO reader;
          GRANT USAGE ON SCHEMA public TO reader;
          CREATE TABLE demo(id int);
          INSERT INTO demo VALUES (1);
          GRANT SELECT ON demo TO reader;
          SQL
          # The image listens on 0.0.0.0, so the start-up gate applies to it — which makes this the
          # place to prove the gate works in the artefact people actually run, not only in a test
          # harness. Without a token it must refuse; the first version of this job did not supply one
          # and was refused, correctly, by the server it was testing.
          docker run -d --name mcpnoauth --network mcpci \
            -e DATABASE_URL="postgres://reader:reader_pw@pgci:5432/postgres" mcp-pg:ci
          sleep 5
          code=$(docker inspect mcpnoauth -f '{{.State.ExitCode}}')
          [ "$code" = "3" ] || { echo "expected the gate to refuse an unauthenticated network listener, got exit $code"; docker logs mcpnoauth; exit 1; }
          docker rm -f mcpnoauth

          # This job needs the host's docker, so it cannot hide inside a container like the others —
          # which makes it the one place left where a published port is a guess about someone else's
          # machine. Ask for a free one instead of hoping 8099 is.
          HOSTPORT=$(./tests/free_port.sh)
          docker run -d --name mcpci --network mcpci -p 127.0.0.1:$HOSTPORT:8080 \
            -e DATABASE_URL="postgres://reader:reader_pw@pgci:5432/postgres" \
            -e MCP_BEARER_TOKEN=ci-token \
            mcp-pg:ci
          for _ in $(seq 1 30); do curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:$HOSTPORT/health >/dev/null && break; sleep 1; done
          docker logs mcpci 2>&1 | grep -q "read-only as far as the database is concerned" \
            || { echo "the image did not report a read-only role"; docker logs mcpci; exit 1; }
          curl -sf -H content-type:application/json -H 'authorization: Bearer ci-token' http://127.0.0.1:$HOSTPORT/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"query","arguments":{"sql":"SELECT id FROM demo"}}}' \
            | grep -q '"id":1'
          docker rm -f mcpci pgci; docker network rm mcpci

      # An image people are told to trust has to be looked at, not only started. Unfixed findings
      # are reported but do not fail the run: a gate nobody can pass is a gate people switch off,
      # and there is nothing to do about a vulnerability with no patch except know about it.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-pg:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  conformance:
    # Everything else in this repository is our test harness talking to our server. If we misread the
    # specification, we misread it the same way in both halves and every check stays green. This job
    # drives the server with the OFFICIAL MCP SDK — the client library the ecosystem actually uses —
    # over stdio and Streamable HTTP. A protocol mistake shows up as a client that cannot talk to us.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    container:
      image: rust:1.97.1-bookworm
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret - throwaway CI database, dies with the runner
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - run: rustup show
      - run: cargo build --release --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Install the official MCP SDK
        working-directory: tests/conformance
        run: npm install --no-audit --no-fund
      - name: Install the PostgreSQL client
        # This step used to reach for the host's docker to borrow a psql, because the host had none.
        # Inside a container the client is simply part of the environment, which is what the previous
        # workaround was trying to simulate.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Seed a table to read
        env:
          PGPASSWORD: ci  # pragma: allowlist secret
        run: |
          psql -h postgres -U postgres -q -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE orders(id int PRIMARY KEY, customer text); INSERT INTO orders VALUES (1,'ada');"
      - name: Talk to the server as a real client would
        env:
          BIN: ${{ github.workspace }}/target/release/postgres-mcp-hardened
          DBURL: postgres://postgres:ci@postgres:5432/postgres  # pragma: allowlist secret
          MCPURL: http://127.0.0.1:8123/mcp
          TOK: conformance-token
        working-directory: tests/conformance
        run: |
          DATABASE_URL="$DBURL" MCP_BEARER_TOKEN="$TOK" MCP_ADDR=127.0.0.1:8123 "$BIN" &
          for _ in $(seq 1 30); do curl -sf -H "authorization: Bearer $TOK" http://127.0.0.1:8123/health >/dev/null && break; sleep 1; done
          node probe.mjs

      # This job runs as root inside the container, and `target/` outlives it on a disk shared with
      # jobs that do not run in a container. Without this step the next such job died in
      # `actions/checkout` with "EACCES: permission denied, unlink target/CACHEDIR.TAG" — it could
      # not clean up files it does not own. `--reference` takes the owner from the directory the
      # runner itself creates, so no UID is hardcoded here and this is a no-op on a hosted runner.
      - name: Hand the workspace back to the runner's user
        if: always()
        run: chown -R --reference="$RUNNER_WORKSPACE" "$RUNNER_WORKSPACE" || true

  platforms:
    # We ship signed binaries for macOS and Windows and had never STARTED one. Cross-compiling proves
    # a binary exists, not that it runs: a missing runtime, a path assumption or a TLS trust store
    # that is not there fails at launch, on a platform no job ever touched. This is the same shape as
    # a release path that was never executed until it was — it looked fine for weeks.
    #
    # No database here on purpose. What needs proving is that the artefact starts and that the parts
    # with no external dependencies work; the database behaviour is covered exhaustively on Linux.
    #
    # Only on a public repository. On a private one these runners bill at 10x (macOS) and 2x
    # (Windows), and adding them exhausted the included minutes: the whole run — including the Linux
    # jobs that had just been green — was rejected in three seconds with no logs at all. The check is
    # worth having and turns itself on the day the repository is published, rather than sitting
    # commented out where nobody would remember it.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - run: rustup show
      - name: The unit tests, which need nothing external
        run: cargo test --release --locked
      # `cargo test` compiles test harnesses into target/release/deps; it does not reliably leave a
      # plain `target/release/<name>` behind. Every step below execs exactly that path, so without
      # this line the whole point of the job — starting the binary on a platform nobody has ever
      # started it on — could not happen. It did not: the first time this job ever ran, 2026-08-07
      # on the newly public repository, it died with `No such file or directory` and exit 127 after
      # 103 green unit tests. The check had been written months earlier and was structurally
      # incapable of doing what its own step name promised.
      - name: Build the binary the steps below actually run
        run: cargo build --release --locked
      - name: The binary starts and the validator answers, both ways
        shell: bash
        run: |
          BIN=target/release/postgres-mcp-hardened
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN=target/release/postgres-mcp-hardened.exe
          out=$("$BIN" --validate "SELECT 1")
          [ "$out" = "ALLOW" ] || { echo "a plain SELECT was not allowed: $out"; exit 1; }
          # A refusal has to survive the platform too — an allow-everything binary would pass a
          # check that only tested the happy path.
          if "$BIN" --validate "DELETE FROM t" | grep -q '^ALLOW'; then
            echo "a DELETE was allowed"; exit 1
          fi
          if "$BIN" --validate "SELECT setval('s',1)" | grep -q '^ALLOW'; then
            echo "a side-effect function was allowed"; exit 1
          fi
      - name: The role generator runs
        shell: bash
        run: |
          BIN=target/release/postgres-mcp-hardened
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN=target/release/postgres-mcp-hardened.exe
          "$BIN" --print-setup-sql | grep -q "CREATE ROLE" || { echo "the generator produced no DDL"; exit 1; }
      - name: A short fuzz run, because a parser can behave differently per platform
        shell: bash
        run: |
          BIN=target/release/postgres-mcp-hardened
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN=target/release/postgres-mcp-hardened.exe
          # Iteration count is a positional argument, not an environment variable — 20k rather than
          # the default 200k because this is asking "does the parser behave the same here", not
          # "find new bypasses"; the full run happens on Linux.
          "$BIN" --fuzz 20000 | tail -3
          "$BIN" --fuzz 20000 | grep -q "0 invariant violations" || { echo "the fuzz harness found a violation on ${{ matrix.os }}"; exit 1; }
