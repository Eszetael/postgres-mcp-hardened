name: Spec drift

# The preview revision is keyed to an identifier we do not control. MCP names a revision for the
# last date a backwards-incompatible change was made, so it MOVES when one more lands — our
# `Rev::V20260728` can go stale through nobody's mistake. "Remember to re-check it" is not a control;
# this is.
#
# Deliberately NOT part of the push gate: upstream renaming their draft is not a reason to block a
# commit here. It runs weekly and on demand, and when it fires the fix is a one-line change plus a
# re-read of the changelog.
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identifier:
    # The same variable as every other job. This workflow once failed with zero steps, rejected by
    # exhausted hosted-runner minutes, and the failure read exactly like a detected spec drift.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare our preview identifier with the normative schema
        shell: bash
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/schema/draft/schema.ts
          upstream=$(curl -sSf --retry 3 "$URL" | sed -n 's/.*LATEST_PROTOCOL_VERSION *= *"\([0-9-]*\)".*/\1/p' | head -1)
          [ -n "$upstream" ] || { echo "could not read LATEST_PROTOCOL_VERSION — the schema moved or the fetch failed"; exit 1; }
          ours=$(sed -n 's/.*Rev::V20260728 => "\([0-9-]*\)".*/\1/p' src/protocol.rs | head -1)
          [ -n "$ours" ] || { echo "could not find our own identifier in src/protocol.rs"; exit 1; }
          echo "upstream draft: $upstream"
          echo "this server:    $ours"
          if [ "$upstream" != "$ours" ]; then
            echo "::error title=Preview identifier is stale::The draft is now $upstream; this server still answers $ours. Re-read the changelog for what else changed, then update Rev and its tests."
            exit 1
          fi
          echo "identifiers agree"
      - name: Fail the moment the draft becomes a released revision
        shell: bash
        run: |
          set -euo pipefail
          # Promotion is the moment `MCP_PROTOCOL_PREVIEW` should stop being a switch and become the
          # default. The previous version of this step scraped modelcontextprotocol.io and compared a
          # date it grepped out of the page. That page answers with a JavaScript shell, so the grep
          # found nothing, the variable was empty, and the comparison was false on every run since it
          # was written. A control that cannot fire is worse than no control: it occupies the place
          # where a real one would go.
          #
          # The unambiguous signal is structural: the specification repository cuts a directory named
          # after the revision when it ships. `draft` becoming `2026-07-28` is a fact, not a rendering.
          ours=$(sed -n 's/.*Rev::V20260728 => "\([0-9-]*\)".*/\1/p' src/protocol.rs | head -1)
          dirs=$(curl -sSf --retry 3 \
                 https://api.github.com/repos/modelcontextprotocol/modelcontextprotocol/contents/schema \
                 | python3 -c 'import json,sys; print(" ".join(d["name"] for d in json.load(sys.stdin) if d["type"]=="dir"))')
          echo "schema directories upstream: $dirs"
          echo "our preview revision:        $ours"
          for d in $dirs; do
            if [ "$d" = "$ours" ]; then
              echo "::error title=The preview is now a released revision::$ours has been cut upstream. Compare it with what we ship behind MCP_PROTOCOL_PREVIEW, then make it the default — a client speaking $ours is currently negotiated DOWN to 2025-11-25."
              exit 1
            fi
          done
          echo "still a draft — the preview switch stays a switch"
