# A working setup in one command: a PostgreSQL with sample data and the MCP server in front of it.
#
#   docker compose -f examples/docker-compose.yml up -d
#   curl -s -H content-type:application/json -H 'authorization: Bearer change-me-before-running' \
#     http://127.0.0.1:8080/mcp \
#     -d '{"jsonrpc":"2.0","id":1,"method":"tools/call",
#          "params":{"name":"query","arguments":{"sql":"SELECT * FROM people"}}}'
#
# The Authorization header is not optional and this file is why: it binds 0.0.0.0, so the server
# refuses to serve without a token. The first version of this comment left the header out, and
# anyone who pasted both lines got "invalid or missing bearer token" from an example that was
# supposed to work in one command. Change the token below before running this anywhere real.
#
# The server connects as `reader`, a role with SELECT and nothing else — the deployment this
# project recommends, not a superuser shortcut that only works in a demo.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  mcp:
    # The published image, so this file plus seed.sql is all you need — no clone, no build.
    image: ghcr.io/eszetael/postgres-mcp-hardened:latest
    # Working on the server itself? Swap the line above for this one to build from the checkout:
    # build: ..

    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://reader:reader_pw@db:5432/postgres
      MCP_ADDR: 0.0.0.0:8080
      # Values that must never reach the model, whatever the query asks for:
      MCP_REDACT_COLUMNS: ssn, card_number
      # Uncomment to require a token on every request:
      # Required, not optional: the server binds 0.0.0.0 here, and it refuses to serve a network
      # listener with no authentication. Generate one with `openssl rand -base64 24`.
      MCP_BEARER_TOKEN: change-me-before-running
    ports:
      - "127.0.0.1:8080:8080"
