[package]
name = "postgres-mcp-hardened"
version = "0.1.0"
edition = "2021"
description = "Secure read-only PostgreSQL MCP server in Rust — a hardened alternative to the deprecated @modelcontextprotocol/server-postgres. AST-validated SELECT-only, timeouts, EXPLAIN cost guard, OAuth 2.1."
license = "MIT"
keywords = ["mcp", "postgres", "postgresql", "sql", "security"]
categories = ["database", "command-line-utilities"]
repository = "https://github.com/Eszetael/postgres-mcp-hardened"
readme = "README.md"

[dependencies]
sqlparser = { version = "0.49.0", features = ["visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
once_cell = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
sha2 = "0.10"
jsonwebtoken = "9"
# TLS to PostgreSQL via rustls (pure Rust) — the image is distroless and has no OpenSSL.
# Without it the server cannot reach ANY hosted PostgreSQL (RDS/Supabase/Neon all require SSL).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = "0.13"
rustls-native-certs = "0.8"
webpki-roots = "1"

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
