# cargo-deny: dependency policy. Run with `cargo deny check`.
[advisories]
yanked = "deny"
ignore = [
    # In the release binary via jsonwebtoken's rust_crypto backend, but no RSA private key exists in
    # the process, so there is nothing for the timing side-channel to recover.
    # See audit.toml for the full rationale.
    "RUSTSEC-2023-0071",
    # Only through jsonwebtoken's ECDSA stack, which an RS256-only verifier never reaches.
    # See audit.toml; remove when jsonwebtoken moves to elliptic-curve >= 0.14.
    "RUSTSEC-2026-0387",
]

[licenses]
# Permissive only. A copyleft dependency would change what users may do with the binary.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
